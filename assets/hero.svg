<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
  <title id="title">Pratap — Full-Stack Developer, AI Builder and Cloud Engineer</title>
  <desc id="desc">A neon cyber developer dashboard with an illustrated programmer at a coding workstation.</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#02050b" stop-opacity="0.05"/>
      <stop offset="0.47" stop-color="#02050b" stop-opacity="0.34"/>
      <stop offset="0.64" stop-color="#02050b" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#02050b" stop-opacity="0.99"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#f8fafc"/><stop offset="0.48" stop-color="#67e8f9"/><stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22d3ee"/><stop offset="0.55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0H0V26" fill="none" stroke="#164e63" stroke-width="0.5" opacity="0.2"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="1" y="1" width="1098" height="558" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1100" height="560" fill="#030711"/>
    <image href="hero-art.png" xlink:href="hero-art.png" x="0" y="0" width="1100" height="615" preserveAspectRatio="xMidYMid slice"/>
    <rect width="1100" height="560" fill="url(#shade)"/>
    <rect width="1100" height="560" fill="url(#grid)"/>
  </g>
  <rect x="1" y="1" width="1098" height="558" rx="20" fill="none" stroke="#155e75" stroke-width="2"/>

  <g transform="translate(570 42)">
    <text x="0" y="18" fill="#64748b" font-family="monospace" font-size="11" letter-spacing="3">HELLO, WORLD — I AM</text>
    <text x="0" y="88" fill="url(#name)" font-family="Arial, sans-serif" font-size="61" font-weight="800" letter-spacing="2" filter="url(#glow)">&lt; PRATAP /&gt;</text>
    <text x="2" y="122" fill="#c4b5fd" font-family="monospace" font-size="13" font-weight="700">FULL-STACK DEVELOPER • AI BUILDER • CLOUD ENGINEER</text>
    <rect x="0" y="143" width="478" height="2" fill="url(#rule)"/>

    <g font-family="monospace" font-size="13">
      <text x="0" y="182" fill="#34d399">› <tspan fill="#e2e8f0">Building production-ready applications</tspan></text>
      <text x="0" y="216" fill="#22d3ee">› <tspan fill="#e2e8f0">Engineering scalable backend systems</tspan></text>
      <text x="0" y="250" fill="#a78bfa">› <tspan fill="#e2e8f0">Creating AI-powered products</tspan></text>
      <text x="0" y="284" fill="#fb923c">› <tspan fill="#e2e8f0">Turning ideas into real systems</tspan></text>
    </g>

    <g transform="translate(0 315)">
      <rect width="478" height="144" rx="13" fill="#050a12" fill-opacity="0.88" stroke="#164e63"/>
      <circle cx="21" cy="20" r="4" fill="#fb7185"/><circle cx="36" cy="20" r="4" fill="#fbbf24"/><circle cx="51" cy="20" r="4" fill="#34d399"/>
      <text x="454" y="24" text-anchor="end" fill="#475569" font-family="monospace" font-size="10">developer.ts</text>
      <g font-family="monospace" font-size="12">
        <text x="22" y="55" fill="#67e8f9">const <tspan fill="#e2e8f0">pratap = {</tspan></text>
        <text x="38" y="80" fill="#f472b6">role: <tspan fill="#6ee7b7">"Full-Stack Developer"</tspan><tspan fill="#e2e8f0">,</tspan></text>
        <text x="38" y="105" fill="#f472b6">focus: <tspan fill="#fbbf24">["AI", "SaaS", "Cloud", "Mobile"]</tspan><tspan fill="#e2e8f0">,</tspan></text>
        <text x="38" y="130" fill="#f472b6">status: <tspan fill="#38bdf8">"BUILDING ⚡"</tspan></text>
      </g>
    </g>
  </g>

  <g transform="translate(32 500)">
    <rect width="500" height="34" rx="8" fill="#030711" fill-opacity="0.86" stroke="#155e75"/>
    <circle cx="18" cy="17" r="5" fill="#34d399" filter="url(#glow)"/>
    <text x="34" y="21" fill="#94a3b8" font-family="monospace" font-size="11">PRATAP495 // SYSTEM ONLINE // OPEN TO BUILD</text>
  </g>
</svg>
