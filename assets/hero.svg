<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc">
  <title id="title">Pratap cyber developer dashboard</title>
  <desc id="desc">A futuristic dashboard introducing Pratap as a full-stack developer, AI builder, and cloud engineer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070A12"/>
      <stop offset="0.55" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#101525"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#22D3EE"/><stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="avatar" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#172554"/><stop offset="1" stop-color="#07111F"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#164E63" stroke-width="0.6" opacity="0.28"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1098" height="608" rx="22" fill="url(#bg)" stroke="#164E63" stroke-width="2"/>
  <rect x="1" y="1" width="1098" height="608" rx="22" fill="url(#grid)"/>
  <path d="M1 58H1099" stroke="#164E63"/>
  <circle cx="28" cy="29" r="6" fill="#FB7185"/><circle cx="50" cy="29" r="6" fill="#FBBF24"/><circle cx="72" cy="29" r="6" fill="#34D399"/>
  <text x="550" y="35" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="13" letter-spacing="3">PRATAP.DEV // SYSTEM ONLINE</text>

  <!-- Original abstract cyber-developer avatar -->
  <g transform="translate(34 93)">
    <rect width="255" height="382" rx="18" fill="#0A101B" stroke="#155E75"/>
    <path d="M0 43H255M0 338H255" stroke="#123047"/>
    <text x="20" y="27" fill="#22D3EE" font-family="monospace" font-size="11">// OPERATOR</text>
    <circle cx="128" cy="168" r="92" fill="#07111F" stroke="#0E7490" stroke-width="2"/>
    <circle cx="128" cy="168" r="76" fill="none" stroke="#312E81" stroke-dasharray="3 8"/>
    <path d="M82 161Q86 98 128 92Q170 98 174 161L163 201Q153 229 128 236Q103 229 93 201Z" fill="url(#avatar)" stroke="#22D3EE" stroke-width="2"/>
    <path d="M84 151L63 183V217L89 205M172 151L193 183V217L167 205" fill="#0F172A" stroke="#8B5CF6" stroke-width="2"/>
    <path d="M100 161L119 166M156 161L137 166" stroke="#67E8F9" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M116 205Q128 211 140 205" fill="none" stroke="#64748B"/>
    <path d="M50 318Q58 251 128 246Q198 251 206 318" fill="#0B1726" stroke="#2563EB" stroke-width="2"/>
    <path d="M128 247V318M89 260L128 294L167 260" fill="none" stroke="#22D3EE" opacity="0.7"/>
    <circle cx="128" cy="294" r="5" fill="#A78BFA" filter="url(#glow)"/>
    <text x="20" y="365" fill="#475569" font-family="monospace" font-size="10">ID: PRATAP495</text>
    <text x="235" y="365" text-anchor="end" fill="#34D399" font-family="monospace" font-size="10">ACTIVE</text>
  </g>

  <!-- Identity and activity -->
  <g transform="translate(320 96)">
    <text x="0" y="26" fill="#94A3B8" font-family="monospace" font-size="13" letter-spacing="3">HELLO, WORLD — I AM</text>
    <text x="0" y="92" fill="url(#cyan)" font-family="monospace" font-size="54" font-weight="700" letter-spacing="2" filter="url(#glow)">&lt; PRATAP /&gt;</text>
    <text x="0" y="126" fill="#C4B5FD" font-family="monospace" font-size="13" font-weight="600">FULL-STACK DEVELOPER • AI BUILDER • CLOUD ENGINEER</text>
    <line x1="0" y1="148" x2="424" y2="148" stroke="#164E63"/>
    <text x="0" y="181" fill="#34D399" font-family="monospace" font-size="13">&gt; <tspan fill="#CBD5E1">Building Production-Ready Applications...</tspan></text>
    <text x="0" y="214" fill="#22D3EE" font-family="monospace" font-size="13">&gt; <tspan fill="#CBD5E1">Engineering Scalable Backend Systems...</tspan></text>
    <text x="0" y="247" fill="#A78BFA" font-family="monospace" font-size="13">&gt; <tspan fill="#CBD5E1">Building AI-Powered Products...</tspan></text>
    <text x="0" y="280" fill="#FB923C" font-family="monospace" font-size="13">&gt; <tspan fill="#CBD5E1">Turning Ideas Into Real Systems...</tspan></text>
    <rect x="0" y="308" width="96" height="38" rx="7" fill="#07131F" stroke="#22D3EE"/><text x="48" y="332" text-anchor="middle" fill="#67E8F9" font-family="monospace" font-size="11">LINKEDIN</text>
    <rect x="106" y="308" width="96" height="38" rx="7" fill="#100D1E" stroke="#8B5CF6"/><text x="154" y="332" text-anchor="middle" fill="#C4B5FD" font-family="monospace" font-size="11">PORTFOLIO</text>
    <rect x="212" y="308" width="96" height="38" rx="7" fill="#071711" stroke="#34D399"/><text x="260" y="332" text-anchor="middle" fill="#6EE7B7" font-family="monospace" font-size="11">EMAIL</text>
    <rect x="318" y="308" width="96" height="38" rx="7" fill="#1A1008" stroke="#FB923C"/><text x="366" y="332" text-anchor="middle" fill="#FDBA74" font-family="monospace" font-size="11">RESUME</text>
  </g>

  <!-- Code terminal -->
  <g transform="translate(764 93)">
    <rect width="304" height="382" rx="18" fill="#090D15" stroke="#312E81"/>
    <rect width="304" height="43" rx="18" fill="#111827"/><path d="M0 43H304" stroke="#312E81"/>
    <circle cx="22" cy="22" r="4" fill="#FB7185"/><circle cx="38" cy="22" r="4" fill="#FBBF24"/><circle cx="54" cy="22" r="4" fill="#34D399"/>
    <text x="283" y="27" text-anchor="end" fill="#64748B" font-family="monospace" font-size="10">developer.ts</text>
    <g font-family="monospace" font-size="12">
      <text x="22" y="79" fill="#C4B5FD">const <tspan fill="#67E8F9">pratap</tspan> <tspan fill="#CBD5E1">= {</tspan></text>
      <text x="36" y="108" fill="#93C5FD">role<tspan fill="#CBD5E1">: </tspan><tspan fill="#FDE68A">"Full-Stack Developer"</tspan><tspan fill="#CBD5E1">,</tspan></text>
      <text x="36" y="137" fill="#93C5FD">focus<tspan fill="#CBD5E1">: [</tspan></text>
      <text x="50" y="166" fill="#FDE68A">"AI", "SaaS",</text>
      <text x="50" y="195" fill="#FDE68A">"Cloud", "Mobile"</text>
      <text x="36" y="224" fill="#CBD5E1">],</text>
      <text x="36" y="253" fill="#93C5FD">status<tspan fill="#CBD5E1">: </tspan><tspan fill="#6EE7B7">"BUILDING ⚡"</tspan><tspan fill="#CBD5E1">,</tspan></text>
      <text x="36" y="282" fill="#93C5FD">available<tspan fill="#CBD5E1">: </tspan><tspan fill="#C4B5FD">true</tspan></text>
      <text x="22" y="311" fill="#CBD5E1">};</text>
    </g>
    <rect x="18" y="330" width="268" height="34" rx="7" fill="#07131F" stroke="#155E75"/>
    <circle cx="36" cy="347" r="5" fill="#34D399" filter="url(#glow)"/>
    <text x="50" y="351" fill="#94A3B8" font-family="monospace" font-size="10">PROFILE VIEWS // LIVE METRIC</text>
  </g>

  <g transform="translate(34 505)">
    <rect width="1032" height="70" rx="14" fill="#090E17" stroke="#1E3A5F"/>
    <text x="22" y="28" fill="#22D3EE" font-family="monospace" font-size="11">SYSTEM STACK</text>
    <text x="22" y="51" fill="#94A3B8" font-family="monospace" font-size="12">PYTHON  /  TYPESCRIPT  /  REACT  /  FASTAPI  /  POSTGRESQL  /  AWS  /  DOCKER  /  AI AGENTS</text>
    <text x="1008" y="41" text-anchor="end" fill="#34D399" font-family="monospace" font-size="11">● OPEN TO BUILD</text>
  </g>
</svg>
