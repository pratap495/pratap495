    <rect x="25" y="166" width="435" height="28" rx="7" fill="#07131f" stroke="#0e7490"/>
    <circle cx="43" cy="180" r="5" fill="#34d399" filter="url(#glow)"/>
    <text x="58" y="184" fill="#94a3b8" font-size="10">github.com/pratap495 // public profile</text>
  </g>

