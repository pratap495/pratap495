      <text x="240" y="111" fill="#67e8f9" font-size="31" font-weight="700">40</text><text x="240" y="136" fill="#64748b" font-size="10">ORIGINAL BUILDS</text>
      <text x="400" y="111" fill="#c4b5fd" font-size="31" font-weight="700">2021</text><text x="400" y="136" fill="#64748b" font-size="10">BUILDING SINCE</text>
